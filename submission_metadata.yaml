  python rank.py --candidates ./candidates.jsonl --out submission.csv

compute:
  platform: Windows 11 / Ubuntu-compatible
  cpu_cores: 8
  ram_gb: 16
  python_version: "3.11.9"
  os: Windows
  uses_gpu_for_inference: false
  has_network_during_ranking: false
  pre_computation_required: true
  pre_computation_time_minutes: 10

ai_tools_used:
  - Claude
  - Antigravity

ai_usage_summary: >
  Claude (Anthropic) and Antigravity were used for pair-programming assistance
  during development: iterating on scoring heuristics, debugging the two-stage
  pipeline architecture, and drafting the methodology summary. All ranking logic,
  data analysis, and final design decisions were made by the team.

methodology_summary: >
  We utilize a two-stage pipeline to rank candidates. First, we precompute semantic
  embeddings using sentence-transformers (all-MiniLM-L6-v2) to capture deep semantic
  similarity between candidate experience and the core JD concepts. Second, we apply
  heuristic layers to evaluate technical depth, behavioral availability, career
  trajectory (discounting consulting-only and pure-research backgrounds), and specific
  JD matches like years of experience and location. The final ranking step combines
  these signals and completes strictly within the 5-minute CPU budget.

