methodology_summary: 'We utilize a two-stage pipeline to rank candidates. First, we
  precompute semantic embeddings using  sentence-transformers (all-MiniLM-L6-v2) to
  capture deep semantic similarity between candidate experience  and the core JD concepts.
  Second, we apply heuristic layers to evaluate technical depth, behavioral availability,  career
  trajectory (discounting consulting-only and pure-research backgrounds), and specific
  JD matches like  years of experience and location. The final ranking step combines
  these signals and completes strictly within  the 5-minute CPU budget.'
